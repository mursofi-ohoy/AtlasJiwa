<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — ATLAS JIWA</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/assets/site.webmanifest">
<meta name="theme-color" content="#3F6B66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,460&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
<!-- auth-guard.js memastikan halaman ini hanya bisa diakses saat sudah
     login; pengecekan tambahan "harus role admin" dilakukan di admin.js -->
<script src="js/auth-guard.js"></script>
</head>
<body>

<header class="admin-header">
  <div class="wrap admin-header-inner">
    <a class="admin-brand" href="atlas-jiwa.html">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="7" fill="var(--accent)"/>
        <path d="M8 14C8 14 12 6 20 6C28 6 32 14 32 14" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"/>
        <path d="M8 26C8 26 12 34 20 34C28 34 32 26 32 26" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="admin-brand-name">ATLAS JIWA</span>
      <span class="admin-badge">Admin</span>
    </a>
    <div class="admin-header-controls">
      <button class="icon-btn" id="theme-toggle" aria-label="Ganti tema">🌙</button>
      <span id="atlasUserName" class="atlas-user-name" hidden></span>
      <button id="atlasLogoutBtn" class="atlas-logout-btn" hidden>Keluar</button>
    </div>
  </div>
</header>

<main class="wrap">

  <div id="adminBanner" class="banner" role="alert"></div>

  <!-- ---------- Ringkasan ---------- -->
  <section class="stat-grid" id="statGrid">
    <div class="stat-card">
      <div class="stat-label">Jumlah User</div>
      <div class="stat-value" id="statUsers">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Jumlah Screening</div>
      <div class="stat-value" id="statScreenings">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Jumlah Login</div>
      <div class="stat-value" id="statLogins">—</div>
    </div>
  </section>

  <!-- ---------- Daftar User ---------- -->
  <section class="panel">
    <div class="panel-head">
      <h2>Daftar User</h2>
      <div class="panel-actions">
        <input type="search" id="userSearch" class="search-input" placeholder="Cari nama, email, atau username...">
        <button class="btn-sm" id="refreshUsersBtn">Muat Ulang</button>
        <button class="btn-sm" id="exportUsersCsvBtn">Export CSV</button>
        <button class="btn-sm" id="exportUsersXlsBtn">Export Excel</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="table-scroll">
        <table class="data-table" id="usersTable">
          <thead>
            <tr>
              <th>Nama Lengkap</th>
              <th>Email</th>
              <th>Username</th>
              <th>Role</th>
              <th>Status</th>
              <th>Terdaftar</th>
              <th>Login Terakhir</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="8" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ---------- Hasil Screening ---------- -->
  <section class="panel">
    <div class="panel-head">
      <h2>Hasil Screening</h2>
      <div class="panel-actions">
        <button class="btn-sm" id="refreshScreeningBtn">Muat Ulang</button>
        <button class="btn-sm" id="exportScreeningCsvBtn">Export CSV</button>
        <button class="btn-sm" id="exportScreeningXlsBtn">Export Excel</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="table-scroll">
        <table class="data-table" id="screeningTable">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>User</th>
              <th>Email</th>
              <th>Jenis Screening</th>
              <th>No. Soal</th>
              <th>Pertanyaan</th>
              <th>Jawaban</th>
              <th>Skor</th>
            </tr>
          </thead>
          <tbody id="screeningTableBody">
            <tr><td colspan="8" class="empty-state">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<!-- ---------- Modal Edit User ---------- -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal-card">
    <h3>Edit User</h3>
    <form id="editUserForm">
      <input type="hidden" id="editUserId">
      <div class="modal-field">
        <label for="editFullName">Nama Lengkap</label>
        <input type="text" id="editFullName" required>
      </div>
      <div class="modal-field">
        <label for="editEmail">Email</label>
        <input type="email" id="editEmail" required>
      </div>
      <div class="modal-field">
        <label for="editUsername">Username</label>
        <input type="text" id="editUsername" required>
      </div>
      <div class="modal-field">
        <label for="editRole">Role</label>
        <select id="editRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="modal-field">
        <label for="editStatus">Status</label>
        <select id="editStatus">
          <option value="active">Active</option>
          <option value="suspended">Suspended</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-sm" id="editCancelBtn">Batal</button>
        <button type="submit" class="btn-sm primary">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
